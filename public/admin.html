<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In Rhythm — Subscribers</title>
<style>
  :root {
    --ink: #1c2b2a;
    --paper: #faf7f1;
    --accent: #2f6f5e;
    --accent-dark: #204c40;
    --muted: #6b7573;
    --line: #e3ddd0;
    --bad: #b3413a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p.lead { color: var(--muted); font-size: 14px; margin: 0 0 24px; }

  .gate { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 24px; max-width: 420px; }
  .gate label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .gate input { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid var(--line); border-radius: 8px; }
  .gate button, .toolbar button {
    margin-top: 14px; padding: 10px 18px; font-size: 14px; font-weight: 700;
    background: var(--accent); color: #fff; border: none; border-radius: 8px; cursor: pointer;
  }
  .gate button:hover, .toolbar button:hover { background: var(--accent-dark); }
  .gate .err { color: var(--bad); font-size: 13px; margin-top: 10px; display: none; }

  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 18px; min-width: 100px; }
  .stat .n { font-size: 22px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .toolbar input[type="search"] {
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; min-width: 220px;
  }
  .toolbar .right { display: flex; gap: 8px; align-items: center; }
  .toolbar button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .toolbar button.secondary:hover { background: #f2ede2; }

  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 13px; }
  th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { background: #f2ede2; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  tr:last-child td { border-bottom: none; }
  select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; background: #fff; }
  .muted { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge.active { background: #eef5f1; color: var(--accent-dark); }
  .badge.pending_confirmation { background: #fdf2df; color: #8a5a00; }
  .badge.paused { background: #eee; color: var(--muted); }
  .badge.unsubscribed { background: #fbeae8; color: var(--bad); }
  .save-flag { font-size: 11px; color: var(--accent-dark); margin-left: 6px; display: none; }
  #tableWrap { display: none; overflow-x: auto; }
  #loadErr { color: var(--bad); font-size: 13px; display: none; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>In Rhythm — Subscribers</h1>
  <p class="lead">View and manage everyone signed up. Changes save immediately.</p>

  <div class="gate" id="gate">
    <label for="tokenInput">Admin token</label>
    <input id="tokenInput" type="password" placeholder="Enter your admin token">
    <button id="unlockBtn">View subscribers</button>
    <div class="err" id="gateErr">That token didn't work. Check it and try again.</div>
  </div>

  <div id="dash" style="display:none;">
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Search name, phone, or email...">
      <div class="right">
        <button class="secondary" id="catchupBtn">Send catch-up welcome</button>
        <button class="secondary" id="refreshBtn">Refresh</button>
        <button class="secondary" id="lockBtn">Lock</button>
      </div>
    </div>

    <div id="catchupMsg" class="muted" style="margin-bottom:10px; display:none;"></div>
    <div id="loadErr"></div>
    <div id="tableWrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Cadence</th>
            <th>Content</th>
            <th>Language</th>
            <th>Status</th>
            <th>Access</th>
            <th>Signed up</th>
            <th>Last sent</th>
            <th>Next send</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'inrhythm_admin_token';
let TOKEN = null;
let ALL_SUBSCRIBERS = [];

const gate = document.getElementById('gate');
const dash = document.getElementById('dash');
const gateErr = document.getElementById('gateErr');
const tokenInput = document.getElementById('tokenInput');

function headers() {
  return { 'Content-Type': 'application/json', 'x-admin-token': TOKEN };
}

async function tryUnlock(token) {
  TOKEN = token;
  const res = await fetch('/api/admin/summary', { headers: headers() });
  if (!res.ok) {
    TOKEN = null;
    gateErr.style.display = 'block';
    return false;
  }
  gateErr.style.display = 'none';
  try { localStorage.setItem(STORAGE_KEY, token); } catch (e) {}
  gate.style.display = 'none';
  dash.style.display = 'block';
  await loadSummary();
  await loadSubscribers();
  return true;
}

document.getElementById('unlockBtn').addEventListener('click', () => {
  const v = tokenInput.value.trim();
  if (v) tryUnlock(v);
});
tokenInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('unlockBtn').click();
});
document.getElementById('lockBtn').addEventListener('click', () => {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  TOKEN = null;
  dash.style.display = 'none';
  gate.style.display = 'block';
  tokenInput.value = '';
});
document.getElementById('refreshBtn').addEventListener('click', () => {
  loadSummary();
  loadSubscribers();
});
document.getElementById('catchupBtn').addEventListener('click', runCatchupWelcome);

async function runCatchupWelcome() {
  const msgEl = document.getElementById('catchupMsg');
  const confirmed = confirm(
    "This sends a one-time catch-up welcome text to every active subscriber who signed up before the delivery fix and " +
    "never actually received their welcome message. It's safe to click even if you've clicked it before - anyone who's " +
    "already gotten this catch-up text (or signed up after the fix) won't be texted again.\n\nSend it now?"
  );
  if (!confirmed) return;

  const btn = document.getElementById('catchupBtn');
  btn.disabled = true;
  btn.textContent = 'Sending...';
  msgEl.style.display = 'block';
  msgEl.textContent = 'Sending catch-up welcome texts...';

  try {
    const res = await fetch('/api/admin/catchup-welcome', { method: 'POST', headers: headers() });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Failed to send catch-up messages');

    if (data.attempted === 0) {
      msgEl.textContent = 'No one needed a catch-up text - everyone eligible has already received one.';
    } else {
      msgEl.textContent = `Done: ${data.sent} of ${data.attempted} catch-up texts sent successfully` +
        (data.failed ? `, ${data.failed} failed (check Twilio logs for those numbers).` : '.');
    }
    await loadSubscribers();
  } catch (err) {
    msgEl.textContent = `Error: ${err.message}`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send catch-up welcome';
  }
}
document.getElementById('search').addEventListener('input', renderRows);

async function loadSummary() {
  const res = await fetch('/api/admin/summary', { headers: headers() });
  if (!res.ok) return;
  const data = await res.json();
  const t = data.totals || {};
  const statsEl = document.getElementById('stats');
  statsEl.innerHTML = [
    ['Total', t.total || 0],
    ['Active', t.active || 0],
    ['Pending', t.pending || 0],
    ['Paused', t.paused || 0],
    ['Unsubscribed', t.unsubscribed || 0],
  ].map(([label, n]) => `<div class="stat"><div class="n">${n}</div><div class="l">${label}</div></div>`).join('');
}

async function loadSubscribers() {
  const errEl = document.getElementById('loadErr');
  const wrapEl = document.getElementById('tableWrap');
  errEl.style.display = 'none';
  try {
    const res = await fetch('/api/admin/subscribers', { headers: headers() });
    if (!res.ok) throw new Error('Failed to load subscribers');
    const data = await res.json();
    ALL_SUBSCRIBERS = data.subscribers || [];
    wrapEl.style.display = 'block';
    renderRows();
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  }
}

function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s.includes('T') ? s : s.replace(' ', 'T') + 'Z');
  if (isNaN(d)) return s;
  return d.toLocaleDateString();
}

// Includes the time (not just the date) - that's the whole point for
// last_sent_at / next_send_at, since diagnosing "why didn't they get a
// text" usually comes down to exactly when the scheduler last ran.
function fmtDateTime(s) {
  if (!s) return '—';
  const d = new Date(s.includes('T') ? s : s.replace(' ', 'T') + 'Z');
  if (isNaN(d)) return s;
  return d.toLocaleString(undefined, {
    month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
  });
}

function optionsFor(name, current, choices) {
  return choices.map(c => `<option value="${c}" ${c === current ? 'selected' : ''}>${c}</option>`).join('');
}

function renderRows() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = ALL_SUBSCRIBERS.filter(s => {
    if (!q) return true;
    return (s.name || '').toLowerCase().includes(q)
      || (s.phone || '').toLowerCase().includes(q)
      || (s.email || '').toLowerCase().includes(q);
  });

  const rowsEl = document.getElementById('rows');
  if (!filtered.length) {
    rowsEl.innerHTML = `<tr><td colspan="11" class="muted">No subscribers match.</td></tr>`;
    return;
  }

  rowsEl.innerHTML = filtered.map(s => `
    <tr data-id="${s.id}">
      <td>${escapeHtml(s.name)}</td>
      <td><input type="tel" data-field="phone" value="${escapeHtml(s.phone)}" style="width:130px;"></td>
      <td>${escapeHtml(s.email || '—')}</td>
      <td>
        <select data-field="cadence">
          ${optionsFor('cadence', s.cadence, ['daily', 'weekly', 'biweekly', 'monthly'])}
        </select>
      </td>
      <td>
        <select data-field="content_preference">
          ${optionsFor('content_preference', s.content_preference || 'both', ['both', 'leadership', 'spiritual'])}
        </select>
      </td>
      <td>
        <select data-field="preferred_language">
          ${optionsFor('preferred_language', s.preferred_language || 'en', ['en', 'es'])}
        </select>
      </td>
      <td>
        <select data-field="status">
          ${optionsFor('status', s.status, ['pending_confirmation', 'active', 'paused', 'unsubscribed'])}
        </select>
        <span class="save-flag">Saved</span>
      </td>
      <td><span class="muted">${escapeHtml(s.access_type || '—')}</span></td>
      <td class="muted">${fmtDate(s.created_at)}</td>
      <td class="muted">${fmtDateTime(s.last_sent_at)}</td>
      <td class="muted">${fmtDateTime(s.next_send_at)}</td>
    </tr>
  `).join('');

  rowsEl.querySelectorAll('select').forEach(sel => {
    sel.addEventListener('change', onFieldChange);
  });
  rowsEl.querySelectorAll('input[data-field="phone"]').forEach(inp => {
    inp.addEventListener('change', onFieldChange);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
  });
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function onFieldChange(e) {
  const row = e.target.closest('tr');
  const id = row.getAttribute('data-id');
  const field = e.target.getAttribute('data-field');
  const value = e.target.value;

  try {
    const res = await fetch(`/api/admin/subscribers/${id}`, {
      method: 'PATCH',
      headers: headers(),
      body: JSON.stringify({ [field]: value }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || 'Save failed');
    }
    const flag = row.querySelector('.save-flag');
    flag.style.display = 'inline';
    setTimeout(() => { flag.style.display = 'none'; }, 1500);
    const sub = ALL_SUBSCRIBERS.find(s => String(s.id) === String(id));
    if (sub) sub[field] = value;
    loadSummary();
  } catch (err) {
    alert(err.message);
  }
}

// Auto-unlock if a token is remembered in this browser.
(function init() {
  let saved = null;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  if (saved) {
    tokenInput.value = saved;
    tryUnlock(saved);
  }
})();
</script>
</body>
</html>
